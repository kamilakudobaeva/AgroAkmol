[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agroaqkol"
version = "0.1.0"
description = "Yield forecast and drought/sukhovei/early-frost risk index for fields in Akmola region (Kazakhstan), with an AI chat layer, backing a mobile app."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "joblib>=1.4.2,<2.0.0",
  "numpy>=1.26.4,<3.0.0",
  "openai>=1.40.0,<2.0.0",
  "openpyxl>=3.1.2,<4.0.0",
  "pandas>=2.2.2,<3.0.0",
  "pydantic>=2.8.2,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "requests>=2.32.3,<3.0.0",
  "scikit-learn>=1.5.1,<2.0.0",
  "shap>=0.46.0,<1.0.0",
  "uvicorn>=0.30.5,<1.0.0",
  "xgboost>=2.1.1,<3.0.0",
]

[project.optional-dependencies]
geo = [
  "planetary-computer>=1.0.0,<2.0.0",
  "pystac-client>=0.8.3,<1.0.0",
  "rasterio>=1.3.10,<2.0.0",
  "stackstac>=0.5.0,<1.0.0",
  "shapely>=2.0.0,<3.0.0",
  "xarray>=2024.1.0",
]
dev = [
  "pytest>=8.3.2,<9.0.0",
  "ruff>=0.6.2,<1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
